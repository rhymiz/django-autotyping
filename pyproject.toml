[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "django-autotyping"
description = "Automatically add type hints for Django powered applications."
authors = [
    {name = "Viicos", email = "65306057+Viicos@users.noreply.github.com"}
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: Django",
    "Typing :: Typed",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    # Track the oldest currently-supported Django series (5.2 LTS) as the floor.
    # No upper cap: the consuming project's own pin selects the actual version,
    # so generated stubs always match the project's installed Django/django-stubs.
    "django>=5.2",
    "django-stubs>=5.2",
    "libcst>=0.4.10",
    "typing-extensions>=4.4.0; python_version < '3.12'",
]
license = {file = "LICENSE"}
dynamic = ["version", "readme"]

[dependency-groups]
dev = [
    "django==5.2.15",
    "django-stubs==5.2.9",
    "mypy==1.8.0",
    "ruff==0.2.0",
]
docs = [
    "mkdocs==1.5.3",
    "mkdocs-material==9.5.7",
    "mkdocstrings[python]==0.24.0",
]
test = [
    "django==5.2.15",
    "django-stubs==5.2.9",
    "mypy==1.8.0",
    "pyright==1.1.345",
    "pytest==7.4.3",
    "tox==4.55.1",
    "tox-gh-actions==3.5.0",
]

[project.urls]
Homepage = "https://github.com/Viicos/django-autotyping"
Source = "https://github.com/Viicos/django-autotyping"
Changelog = "https://github.com/Viicos/django-autotyping/blob/main/CHANGELOG.md"
Documentation = "https://viicos.github.io/django-autotyping/"

[tool.setuptools.dynamic]
version = {attr = "django_autotyping.__version__"}

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"django_autotyping" = ["py.typed"]

[tool.ruff]
line-length = 120
src = ["src"]
exclude = ["tests/codemodtestproj", "tests/stubstestproj", "tests/stubbing/testfiles"]
target-version = "py38"

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = [
    "E",      # pycodestyle (E)
    "W",      # pycodestyle (W)
    "F",      # Pyflakes
    "UP",     # pyupgrade
    "I",      # isort
    "PL",     # Pylint
    "RUF",    # Ruff
    "RUF022", # Ruff-preview
    "YTT",    # flake8-2020
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "T10",    # flake8-debugger
    "PIE",    # flake8-pie
    "T20",    # flake8-print
    "RSE",    # flake8-raise
    "PTH",    # flake8-use-pathlib
]
ignore = [
    "PLR0912",
    "PLR0913",
    "PLW2901",
    "RUF012",
]

[tool.ruff.lint.isort]
known-first-party = ["django_autotyping"]

[tool.pytest.ini_options]
pythonpath = "src"
norecursedirs = "tests/helpers"
markers = [
    "mypy: test generated stubs against mypy (deselect with '-m \"not mypy\"')",
    "pyright: test generated stubs against pyright (deselect with '-m \"not pyright\"')",
]
