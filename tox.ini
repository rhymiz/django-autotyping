[tox]
requires =
    tox>=4.55.1
envlist = py3{10,11,12}, pyright

[gh-actions]
python =
    3.10: py310
    3.11: py311, mypy, pyright
    3.12: py312

[testenv]
dependency_groups = test
commands =
    pytest --basetemp={envtmpdir}/codemodding -m "not pyright and not mypy" tests/codemodding {posargs}
    pytest --basetemp={envtmpdir}/stubbing -m "not pyright and not mypy" tests/stubbing tests/unit {posargs}

[testenv:mypy]
basepython = py311
commands = pytest --basetemp={envtmpdir} -m "mypy" {posargs}

[testenv:pyright]
basepython = py311
commands = pytest --basetemp={envtmpdir} -m "pyright" {posargs}
