[tox]
requires =
    tox>=4.67.1
    tox-uv>=1.37.0
envlist =
    py3{11,12,13,14}-django52
    py3{12,13,14}-django{60,61}
    {mypy,pyright}-django{52,60,61}

[testenv]
dependency_groups = test
deps =
    django52: django~=5.2.0
    django52: django-stubs~=5.2.0
    django60: django~=6.0.0
    django60: django-stubs~=6.0.0
    django61: django~=6.1.0
    django61: django-stubs~=6.1.0
commands =
    pytest --basetemp={envtmpdir}/codemodding -m "not pyright and not mypy" tests/codemodding {posargs}
    pytest --basetemp={envtmpdir}/stubbing -m "not pyright and not mypy" tests/stubbing tests/unit {posargs}

[testenv:{mypy,pyright}-django{52,60,61}]
base_python = py313
commands =
    mypy: pytest --basetemp={envtmpdir} -m "mypy" {posargs}
    pyright: pytest --basetemp={envtmpdir} -m "pyright" {posargs}
