name: tests

on: [push]

jobs:
  envs:
    name: List tox environments
    runs-on: ubuntu-latest
    outputs:
      envs: ${{ steps.list.outputs.envs }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v10
      - id: list
        name: List tox environments
        run: echo "envs=$(uv run --only-group tox tox -l | jq -Rsc 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"

  test:
    name: Run ${{ matrix.toxenv }}
    needs: envs
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toxenv: ${{ fromJSON(needs.envs.outputs.envs) }}

    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v10
      - name: Test with tox
        run: uv run --only-group tox tox -e ${{ matrix.toxenv }}
